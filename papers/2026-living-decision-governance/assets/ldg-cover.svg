<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Living Decision Governance cover</title>
  <desc id="desc">A restrained dark technical cover showing a continuous decision loop around human, AI, stakeholder and outcome nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091421"/>
      <stop offset="0.58" stop-color="#102d3d"/>
      <stop offset="1" stop-color="#173f4d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a85f"/>
      <stop offset="1" stop-color="#f1d59a"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1240" cy="270" r="260" fill="#2e6674" opacity="0.18" filter="url(#soft)"/>
  <circle cx="410" cy="650" r="300" fill="#21495d" opacity="0.2" filter="url(#soft)"/>
  <g fill="none" stroke="#8fb2ba" stroke-opacity="0.28" stroke-width="2">
    <path d="M210 670 C420 450 500 300 780 310 C1080 320 1200 520 1390 350"/>
    <path d="M170 730 C390 500 520 400 790 420 C1040 438 1220 650 1420 500"/>
    <path d="M310 760 C510 650 600 600 830 610 C1080 625 1230 760 1450 690"/>
  </g>
  <g stroke="url(#gold)" stroke-width="3" fill="#0f2632">
    <circle cx="300" cy="620" r="24"/><circle cx="555" cy="390" r="24"/><circle cx="815" cy="355" r="24"/>
    <circle cx="1080" cy="470" r="24"/><circle cx="1310" cy="380" r="24"/>
  </g>
  <g fill="#f4ddb0" font-family="Inter,Arial,sans-serif" font-size="20" text-anchor="middle">
    <text x="300" y="625">DATA</text><text x="555" y="395">AI</text><text x="815" y="360">HUMAN</text><text x="1080" y="475">REVIEW</text><text x="1310" y="385">OUTCOME</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="120" y="170" fill="#f3f6f7" font-size="72" font-weight="700">Living Decision Governance</text>
    <text x="124" y="225" fill="#b9cbd1" font-size="31">An Executable Architecture for Continuous Human–AI Decision Governance</text>
    <text x="124" y="805" fill="#d8b879" font-size="26">Decisions are not events. Govern the feedback loop.</text>
    <text x="124" y="846" fill="#88a5ae" font-size="18">Amir Ahmadi · Public Working Paper · 2026</text>
  </g>
</svg>