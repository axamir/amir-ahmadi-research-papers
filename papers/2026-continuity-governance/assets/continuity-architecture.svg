<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Continuity governance architecture</title><desc id="desc">Owner, integrator, operator, and continuity, with operational authority flowing downward and knowledge and responsibility lineage preserved across all layers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1721"/><stop offset="1" stop-color="#172d38"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#9fd9d3"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="92" y="100" fill="#dcefee" font-family="Arial,sans-serif" font-size="34" font-weight="700">A four-layer model for long-duration critical infrastructure</text><text x="92" y="143" fill="#9ebec0" font-family="Arial,sans-serif" font-size="22">Continuity does not own or operate the asset; it protects the conditions for accountable handover.</text>
  <g font-family="Arial,sans-serif"><g fill="#102834" stroke="#78bdb9" stroke-width="2"><rect x="100" y="250" width="300" height="190" rx="22"/><rect x="460" y="250" width="300" height="190" rx="22"/><rect x="820" y="250" width="300" height="190" rx="22"/><rect x="1180" y="250" width="300" height="190" rx="22"/></g>
  <g fill="#dcefee" font-size="30" font-weight="700"><text x="200" y="315">OWNER</text><text x="530" y="315">INTEGRATOR</text><text x="900" y="315">OPERATOR</text><text x="1240" y="315">CONTINUITY</text></g>
  <g fill="#a7c7c9" font-size="20"><text x="139" y="360">purpose, capital,</text><text x="139" y="388">rights, obligations</text><text x="493" y="360">system design,</text><text x="493" y="388">interfaces, assurance</text><text x="852" y="360">safe use, maintenance,</text><text x="852" y="388">incident response</text><text x="1217" y="360">memory, auditability,</text><text x="1217" y="388">handover safeguards</text></g>
  <path d="M400 345H452M760 345H812" stroke="#9fd9d3" stroke-width="4" marker-end="url(#a)"/><text x="494" y="222" fill="#9fd9d3" font-size="21">delegated operational authority</text>
  <path d="M1330 455V610H245V455" fill="none" stroke="#e5bd75" stroke-width="4" marker-end="url(#a)"/><text x="553" y="670" fill="#e5bd75" font-size="26" font-weight="700">knowledge / epistemic lineage</text><text x="533" y="705" fill="#c7d9d8" font-size="20">decisions, evidence, assumptions, versions, uncertainties, and lessons learned</text>
  <path d="M245 500V770H1330V500" fill="none" stroke="#b5a4d8" stroke-width="4" marker-end="url(#a)"/><text x="570" y="825" fill="#c7b8e6" font-size="26" font-weight="700">responsibility lineage</text><text x="468" y="858" fill="#c7d9d8" font-size="20">who was authorised, who decided, who accepted risk, and what was transferred</text></g>
</svg>
