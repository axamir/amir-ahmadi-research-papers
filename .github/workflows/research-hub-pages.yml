name: Deploy Research Hub to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'papers/**'
      - '2026/**'
      - '.github/workflows/research-hub-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication renderer
        run: python -m pip install --disable-pip-version-check 'Markdown>=3.7,<4' 'Pillow>=10,<12'
      - name: Validate source links
        run: python site/validate.py
      - name: Build bilingual full-text publication artifact
        run: python site/build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Research Hub artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
