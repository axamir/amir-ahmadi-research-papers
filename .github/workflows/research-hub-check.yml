name: Research Hub validation

on:
  push:
    paths:
      - 'site/**'
      - 'papers/**'
      - '2026/**'
      - '.github/workflows/research-hub-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'papers/**'
      - '2026/**'
      - '.github/workflows/research-hub-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication renderer
        run: python -m pip install --disable-pip-version-check 'Markdown>=3.7,<4'
      - name: Validate source links
        run: python site/validate.py
      - name: Build publication artifact
        run: python site/build.py
      - name: Verify full-text bilingual publication
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/fa/index.html
          test -f _site/papers/living-decision-governance/index.html
          test -f _site/fa/papers/living-decision-governance/index.html
          grep -q 'rel="canonical"' _site/index.html
          grep -q 'ScholarlyArticle' _site/papers/living-decision-governance/index.html
          grep -q 'ScholarlyArticle' _site/fa/papers/living-decision-governance/index.html
          grep -q 'markdown-body' _site/papers/relational-co-evolution/index.html
          grep -q 'markdown-body' _site/fa/papers/relational-co-evolution/index.html
