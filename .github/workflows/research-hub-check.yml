name: Research Hub validation

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/research-hub-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/research-hub-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local links
        run: python site/validate.py
