name: Research Hub validation

on:
  push:
    paths:
      - 'site/**'
      - 'papers/**'
      - '2026/**'
      - '.github/workflows/research-hub-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'papers/**'
      - '2026/**'
      - '.github/workflows/research-hub-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication renderer
        run: python -m pip install --disable-pip-version-check 'Markdown>=3.7,<4' 'Pillow>=10,<12'
      - name: Validate source links
        run: python site/validate.py
      - name: Build publication artifact
        run: python site/build.py
      - name: Verify launch-ready bilingual publication
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/fa/index.html
          test -f _site/assets/polish.css
          grep -q 'rel="canonical"' _site/index.html
          ! grep -q 'hreflang="fa"' _site/index.html
          ! grep -q 'EN / FA\|EN/FA\|نسخه فارسی\|Persian edition' _site/index.html
          slugs=(continuity-governance living-decision-governance beyond-intelligence-ai-evolution relational-co-evolution reflections-and-their-owners from-stamp-to-alliance from-money-to-pledge i-you-and-we designing-rest before-the-first-chapter from-genesis-to-witness beyond-models-hacs)
          for slug in "${slugs[@]}"; do
            test -f "_site/papers/$slug/index.html"
            test -f "_site/fa/papers/$slug/index.html"
            grep -q 'ScholarlyArticle' "_site/papers/$slug/index.html"
            grep -q 'ScholarlyArticle' "_site/fa/papers/$slug/index.html"
            grep -q 'markdown-body' "_site/papers/$slug/index.html"
            grep -q 'markdown-body' "_site/fa/papers/$slug/index.html"
            ! grep -q 'hreflang="fa"' "_site/papers/$slug/index.html"
            ! grep -q 'EN / FA\|EN/FA\|نسخه فارسی\|Persian edition' "_site/papers/$slug/index.html"
            grep -q 'hreflang="en"' "_site/fa/papers/$slug/index.html"
            grep -q 'لایهٔ فارسی' "_site/fa/papers/$slug/index.html"
            ! grep -qi 'source-warning\|Test content' "_site/papers/$slug/index.html"
            test -s "_site/assets/og/$slug-en.png"
            test -s "_site/assets/og/$slug-fa.png"
          done
          grep -q 'Vazirmatn' _site/assets/polish.css
          test -f _site/sitemap.xml
